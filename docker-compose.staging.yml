version: '3.9'

services:

  # ─── PostgreSQL con TimescaleDB ──────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: fiora-postgres-staging
    restart: unless-stopped
    env_file:
      - backend/.env.staging
    environment:
      POSTGRES_DB: fiora_staging
      POSTGRES_USER: fiora
    ports:
      - "100.102.50.17:5434:5432"
    volumes:
      - postgres_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiora -d fiora_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fiora-redis-staging
    restart: unless-stopped
    env_file:
      - backend/.env.staging
    entrypoint: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\" --loglevel warning"]
    volumes:
      - redis_staging:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fiora-backend-staging
    restart: unless-stopped
    env_file:
      - backend/.env.staging
    environment:
      LOG_DIR: /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./logs/staging:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Portainer ───────────────────────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: fiora-portainer-staging
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_staging:/data

volumes:
  postgres_staging:
  redis_staging:
  portainer_staging:
