# ── Listener interno (rete Docker) ───────────────────────────────────────────
# Solo backend, non pubblicato all'esterno da docker-compose.
listener 1883
protocol mqtt

# ── Listener pubblico TLS (vasi ESP32) ───────────────────────────────────────
listener 8883
protocol mqtt
cafile /mosquitto/ssl/ca.crt
certfile /mosquitto/ssl/server.crt
keyfile /mosquitto/ssl/server.key
tls_version tlsv1.2
# I vasi si autenticano con username/password, non con certificato client.
require_certificate false

# ── Autenticazione (globale, vale per entrambi i listener) ───────────────────
# Nessun accesso anonimo: ogni client deve presentare username/password.
# Credenziale condivisa (backend + vasi), stesso modello di HiveMQ Cloud.
# Generare/aggiornare il file con:
#   docker exec -it fiora-mosquitto-staging \
#     mosquitto_passwd -b /mosquitto/config/passwd <utente> <password>
# poi: docker compose -f docker-compose.staging.yml restart mosquitto
allow_anonymous false
password_file /mosquitto/config/passwd

# ── ACL ──────────────────────────────────────────────────────────────────────
# Limita l'utente condiviso al solo sottoalbero dei vasi.
acl_file /mosquitto/config/acl

# ── Persistenza ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Log ──────────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
